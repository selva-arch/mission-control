# Solar Ad Scraper configuration

# Meta Ad Library country code (AU = Australia)
country: AU

# Search terms. Each runs as a separate Ad Library query and results are merged
# and de-duplicated by ad archive ID.
keywords:
  - solar battery
  - home battery
  - battery rebate
  - Tesla Powerwall
  - Sungrow battery
  - Fox ESS battery
  - Pylontech battery
  - BYD battery
  - Anker SOLIX

# How many times to scroll each result page to lazy-load more ads.
# ~10 pulls in a few hundred ads per keyword; raise for deeper sweeps.
max_scrolls: 25

# Which ads to include:
#   active   = only ads running right now
#   all      = active + inactive/expired (lets you see historical price points)
#   inactive = only expired ads
active_status: all

# Run a real browser window so you can log into Facebook the first time.
# After first login the session is reused from ./.fb-profile (gitignored).
headless: false

# Download ad creative images and OCR prices baked into the graphics.
ocr_enabled: true

# How many creatives per ad to OCR. The price often sits on a later card,
# not the first (hero) image, so OCR a few. Higher = better yield, slower.
max_images_per_ad: 4

# Output CSV path
output: out/solar-ads.csv

# Federal rebate model (Cheaper Home Batteries Program, from 1 May 2026).
# Used to estimate the post-rebate price when an ad shows a pre-rebate figure.
# STC value assumption (~$/STC after admin margin) and tiered factors.
rebate:
  dollars_per_kwh_tier1: 272   # first 14 kWh
  dollars_per_kwh_tier2: 163   # 14-28 kWh
  dollars_per_kwh_tier3: 41    # 28-50 kWh
  tier1_cap: 14
  tier2_cap: 28
  tier3_cap: 50

# ---------------------------------------------------------------------------
# Tariff + battery model (used by usage_model.py, not the scraper).
# Clock hours (0-23) each time-of-use period covers. Defaults below match the
# user's SA plan: Peak 6-10am & 4pm-midnight, Off-peak 12-6am, Shoulder 10am-4pm.
# ---------------------------------------------------------------------------
tariff:
  supply_per_day: 0.78958
  rates:
    peak: 0.36410
    shoulder: 0.17732
    offpeak: 0.21329
  hours:
    peak: [6, 7, 8, 9, 16, 17, 18, 19, 20, 21, 22, 23]
    offpeak: [0, 1, 2, 3, 4, 5]
    shoulder: [10, 11, 12, 13, 14, 15]
  round_trip_efficiency: 0.90
  battery_sizes_usable: [10, 13.5, 16, 20, 27]
