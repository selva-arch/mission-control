# Copy to config.yaml and fill in. config.yaml is gitignored (holds your key).

# Google Maps Platform API key (only needed if imagery.source = google).
google_api_key: "YOUR_KEY_HERE"

# Nearmap API key (Integrations > API Keys). Keep secret — config.yaml is gitignored.
nearmap:
  api_key: "YOUR_NEARMAP_KEY"
  packs: "solar,roof_char"          # AI packs (confirm via packs.json on your account)
  ai_path: "/ai/features/v4/features.json"   # or /ai/features/v4/bulk/features.json
  aoi_size_m: 25                     # square AOI around each address point (metres)

target_suburb: "Dulwich, SA"
country: "AU"

imagery:
  source: nearmap         # nearmap | google | licensed | local
  zoom: 21                 # Nearmap Vert detail; ~20-21
  tile_grid: 3             # NxN tiles to stitch (odd)
  footprint_m: 40          # crop box around the roof (metres)
  size: "640x640"          # (google only) Static Maps tile size

detect:
  backend: vision_model    # nearmap (needs AI entitlement) | vision_model (works now) | cnn
  min_confidence: 0.6      # mail only roofs classified no-solar at/above this confidence
  vision:                  # automated detector running on the Nearmap tiles
    provider: anthropic    # anthropic | openai
    model: claude-haiku-4-5-20251001   # cheap+fast vision; or gpt-4o-mini for openai
    # api_key: optional — else reads ANTHROPIC_API_KEY / OPENAI_API_KEY from env

sizing:
  default_kw: 6.6          # used when no Google Solar API / Nearmap roof area available

render:
  mode: composite          # composite | ai
  panel_texture: assets/panel.png

# Reused by savings.py — your retail tariff + solar assumptions (Adelaide).
tariff:
  retail_rate: 0.3641      # $/kWh offset when self-consumed (use your peak/usage blend)
  feed_in_tariff: 0.05     # $/kWh exported
  self_consumption: 0.40   # fraction of generation used on-site (no battery)
  specific_yield: 1400     # kWh per kW per year, Adelaide

flyer:
  brand: "Your Solar Co"
  cta: "Book a free assessment"
  booking_url: "https://example.com/book"
  phone: "1300 000 000"
  format: "A4"             # A4 | DL

mail:
  mode: addressed          # addressed | unaddressed
  salutation: "To the Homeowner"

output_dir: "out"
